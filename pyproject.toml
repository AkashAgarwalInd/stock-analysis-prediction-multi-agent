[project]
name = "stock-analysis"
version = "0.1.0"
description = "Multi-Agent Indian Stock Analyst + Adaptive Weekly Forecaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "alembic>=1.13.0",
    "sqlite-utils>=3.37.0",
    "feedparser>=6.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["mock_llm: test uses a mocked or unavailable LLM"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM", "T20"]
ignore = ["S101", "PTH118", "PTH123", "TRY003", "TRY300", "TRY301"]
per-file-ignores = ["tests/*:S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true
exclude = ["tests/"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stock_analysis*"]
